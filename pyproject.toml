[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctlabel"
version = "0.1.0"
description = "Token-exact counterfactual rollout labels for critical reasoning tokens"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyarrow>=15",
  "PyYAML>=5.4",
  "sympy>=1.12",
  "antlr4-python3-runtime>=4.11,<4.14",
  "tqdm>=4.66",
  "torch>=2.3",
  "transformers>=4.45",
  "vllm>=0.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ctlabel*"]

[tool.setuptools.package-data]
ctlabel = ["vendor/LICENSE.txt", "vendor/input/*.jsonl"]

[tool.pytest.ini_options]
markers = ["gpu: requires a CUDA GPU and model downloads"]

